# This workflow will build and push a Java application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-java?tabs=javase&pivots=platform-linux
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the JAVA_VERSION environment variable below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Build and deploy JAR app to Azure Web App

env:
  AZURE_WEBAPP_NAME: dsgt_PaaS_hotel_rest    # set this to the name of your Azure Web App
  AZURE_WEBAPP_JAR_FOLDER: hotel_rest_app    # set folder name where to upload jar file to
  AZURE_WEBAPP_SERVICE_NAME: springboot_hotel.service # Service name for jar file
  JAVA_VERSION: '17'                  # set this to the Java version to use
  DISTRIBUTION: temurin                  # set this to the Java distribution

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: 'maven'

      - name: Create configuration file for DB
        run: |
          cat <<EOF > database.properties
          # ====================
          # JPA for DB configuration
          # ====================
          spring.datasource.hikari.jdbc-url=${{ secrets.AZURE_WEBAPP_DB_URL }}
          spring.datasource.url=${{ secrets.AZURE_WEBAPP_DB_URL }}
          spring.datasource.username=${{ secrets.AZURE_WEBAPP_DB_USERNAME }}
          spring.datasource.password=${{ secrets.AZURE_WEBAPP_DB_PASSWORD }}
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=true
          EOF

      - name: Update configuration files before build
        run: mv database.properties ./src/main/resources

      - name: Check created file
        run: |
          ls -la ./src/main/resources
          cat ./src/main/resources/database.properties

      - name: Build with Maven
        run: mvn clean package

      - name: List target directory
        run: ls -l target

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/${{ env.AZURE_WEBAPP_NAME }}*.jar'

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: List directory
        run: ls -l
      
      - name: Get jar name
        id: jarname
        run: echo "JAR_NAME=$(ls ${{ env.AZURE_WEBAPP_NAME }}*.jar)" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_PRIVATE_KEY }}
          port: 22
          source: "${{ env.JAR_NAME }}"
          target: "/home/${{ secrets.AZURE_VM_USER }}/${{ env.AZURE_WEBAPP_JAR_FOLDER }}"

      - name: Restart app on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_PRIVATE_KEY }}
          port: 22
          script: |
            FILE="/etc/systemd/system/${{ env.AZURE_WEBAPP_SERVICE_NAME }}"
            if [ -f "$FILE" ]; then
              echo "✅ File exists. Restarting service..."
              sudo systemctl restart ${{ env.AZURE_WEBAPP_SERVICE_NAME }}
            else
              echo "❌ File $FILE not found. Failing workflow."
              exit 1
            fi