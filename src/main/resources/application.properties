spring.jackson.serialization.indent_output = true
server.port=8100
server.tomcat.threads.max=200

# ====================
# Hikari configuration
# ====================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-init-sql=SELECT 1
# Additional optimization
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=1
# Enable these in production only
spring.datasource.hikari.register-mbeans=true
management.endpoints.web.exposure.include=health,metrics,info
# Add to check pool status
spring.datasource.hikari.health-check-properties.enabled=true

# Import configurations
spring.config.import=optional:classpath:database.properties,\
  optional:classpath:jwt.properties
